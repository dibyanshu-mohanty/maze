name: maze
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=2.18.2 <3.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  card_swiper: ^2.0.4
  sizer: ^2.0.15
  google_fonts:
  pin_code_fields: ^7.4.0
  badges: ^2.0.3
  shared_preferences: ^2.0.17
  json_serializable: ^6.5.4
  json_annotation: ^4.7.0
  build_runner: ^2.3.3
  http: ^0.13.5
  provider: ^6.0.5
  hive: ^2.2.3
  objectdb: ^1.2.1+1
  auto_size_text: ^3.0.0
  device_preview: ^1.1.0
  percent_indicator: ^4.2.2
  chewie: ^1.3.6
  flutter_markdown: ^0.6.13
  better_player: ^0.0.83
  persistent_bottom_nav_bar: ^5.0.2
  iconify_flutter: ^0.0.5
  colorful_iconify_flutter: ^0.0.3
  flutter_onboarding_slider: ^1.0.8
  story_view: ^0.14.0
  story: ^1.0.0+1
  fl_chart: ^0.55.2
  fluttertoast: ^8.1.2
  intl: ^0.17.0
  flutter_spinkit: ^5.1.0
  connectivity_plus: ^3.0.2
  pretty_qr_code: ^2.0.3
  share_plus: ^6.3.1
  lottie:
  font_awesome_flutter:
  swipeable_button_view: ^0.0.2
  dotted_line: ^3.1.0
  carousel_slider: ^4.2.1
  dio: ^5.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/video.mp4
    - assets/images/onboardScreen/
    - assets/images/homeScreen/
    - assets/icons/
    - assets/images/learningScreen/
    - assets/images/rewardScreen/
    - assets/images/learningScreen/modules/
    - assets/animations/
    - assets/animations/digitalGoldScreen/
    - assets/animations/learningScreen/
    - assets/icons/homeScreen/
    - assets/icons/learningScreen/
    - assets/images/virtualSimulator/
    - assets/images/goldScreen/

  fonts:
#    - family: Schyler
#      fonts:
#        - asset: fonts/Schyler-Regular.ttf
#        - asset: fonts/Schyler-Italic.ttf
#          style: italic
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 600
        - asset: assets/fonts/Satoshi-Black.ttf
          weight: 700
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
