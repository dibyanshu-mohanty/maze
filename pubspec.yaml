name: maze
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=2.18.5 <3.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  card_swiper: ^2.0.4
  sizer: ^2.0.15
  google_fonts:
  pin_code_fields: ^7.4.0
  badges: ^2.0.3
  json_serializable: ^6.5.4
  json_annotation: ^4.7.0
  build_runner: ^2.3.3
  http: ^0.13.5
  provider: ^6.0.5
  hive: ^2.2.3
  objectdb: ^1.2.1+1
  auto_size_text: ^3.0.0
  device_preview: ^1.1.0
  game_levels_scrolling_map: ^0.0.7
  level_map: ^0.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboardScreen/
    - assets/images/homeScreen/
    - assets/icons/
    - assets/images/learningScreen/
    - assets/images/rewardScreen/

  fonts:
#    - family: Schyler
#      fonts:
#        - asset: fonts/Schyler-Regular.ttf
#        - asset: fonts/Schyler-Italic.ttf
#          style: italic
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 600
        - asset: assets/fonts/Satoshi-Black.ttf
          weight: 700
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
